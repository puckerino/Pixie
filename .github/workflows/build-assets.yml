name: Build Assets

on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Create dist folder
        run: mkdir -p dist

      - name: Build Head CSS
        run: |
          esbuild main-head.css \
            --bundle \
            --minify \
            --outfile=dist/pixie-head.min.css

      - name: Build Body CSS
        run: |
          esbuild main-body.css \
            --bundle \
            --minify \
            --outfile=dist/pixie-body.min.css

      - name: Build End CSS
        run: |
          esbuild main-end.css \
            --bundle \
            --minify \
            --outfile=dist/pixie-end.min.css

      - name: Build JS
        run: |
          esbuild main.js \
            --bundle \
            --minify \
            --outfile=dist/pixie.min.js

      - name: Commit and Push Dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update compiled assets [skip ci]"
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
